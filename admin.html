<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welease — Beheer</title>
<style>
:root {
  --brand:#2db37a; --brand-deep:#1a8f5a; --brand-glow:rgba(45,179,122,.2);
  --red:#e8420a; --red-glow:rgba(232,66,10,.15);
  --amber:#f59e0b;
  --bg:#f5f5f7; --bg-alt:#fbfbfd;
  --surface:rgba(255,255,255,.78); --surface-hi:rgba(255,255,255,.92); --surface-lo:rgba(255,255,255,.52);
  --glass-bar:rgba(249,249,251,.86);
  --text-1:#1d1d1f; --text-2:#515154; --text-3:#86868b; --text-4:#aeaeb2;
  --border:rgba(0,0,0,.08); --border-hi:rgba(0,0,0,.13); --border-lo:rgba(0,0,0,.04);
  --shadow-xs:0 1px 3px rgba(0,0,0,.05);
  --shadow-sm:0 2px 8px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 8px 24px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05);
  --shadow-lg:0 20px 60px rgba(0,0,0,.13),0 8px 24px rgba(0,0,0,.07);
  --shadow-xl:0 32px 80px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.09);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-2xl:32px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --blur-sm:blur(12px); --blur-md:blur(20px); --blur-lg:blur(40px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;--bg-alt:#0a0a0b;
    --surface:rgba(28,28,30,.82);--surface-hi:rgba(44,44,46,.92);--surface-lo:rgba(28,28,30,.52);
    --glass-bar:rgba(18,18,20,.9);
    --text-1:#f5f5f7;--text-2:#aeaeb2;--text-3:#6e6e73;--text-4:#48484a;
    --border:rgba(255,255,255,.1);--border-hi:rgba(255,255,255,.16);--border-lo:rgba(255,255,255,.04);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text-1);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--brand);text-decoration:none}
img{display:block}
button{cursor:pointer;font-family:inherit}

/* ── LOGIN ── */
#login-screen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-box{
  background:var(--surface-hi);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);
  border:1px solid var(--border-hi);border-radius:var(--r-2xl);
  padding:40px 36px;width:100%;max-width:380px;
  box-shadow:var(--shadow-xl);text-align:center;
  animation:fade-up .4s var(--ease-out);
}
@keyframes fade-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.login-logo{font-size:28px;font-weight:800;color:var(--brand);letter-spacing:-.04em;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text-3);margin-bottom:28px}
.login-box input{
  width:100%;border:1px solid var(--border-hi);border-radius:var(--r-md);
  padding:13px 16px;font-size:15px;color:var(--text-1);background:var(--surface);
  outline:none;font-family:inherit;transition:border-color .18s,box-shadow .18s;margin-bottom:10px;
}
.login-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-glow)}
.login-box input::placeholder{color:var(--text-4)}
.btn-login{
  width:100%;background:var(--brand);color:#fff;border:none;
  border-radius:var(--r-md);padding:13px;font-size:15px;font-weight:600;
  transition:background .18s,transform .15s var(--ease-spring),box-shadow .18s;
}
.btn-login:hover{background:var(--brand-deep);box-shadow:0 4px 16px var(--brand-glow)}
.btn-login:active{transform:scale(.99)}
#login-error{color:var(--red);font-size:12px;margin-top:8px;display:none}

/* ── TOPBAR ── */
header{
  position:sticky;top:0;z-index:100;
  background:var(--glass-bar);backdrop-filter:var(--blur-md) saturate(180%);
  -webkit-backdrop-filter:var(--blur-md) saturate(180%);
  border-bottom:1px solid var(--border);
  height:56px;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  box-shadow:var(--shadow-xs);
}
.header-brand{font-size:18px;font-weight:800;color:var(--brand);letter-spacing:-.04em}
.nav-tabs{display:flex;gap:4px}
.nav-tab{
  background:transparent;border:none;color:var(--text-3);
  font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--r-sm);
  transition:background .15s,color .15s;
}
.nav-tab:hover{background:var(--surface);color:var(--text-1)}
.nav-tab.active{background:var(--surface-hi);color:var(--text-1);box-shadow:var(--shadow-xs)}
.header-right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-3)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--brand-glow)}

/* ── STATS BAR ── */
.stats-bar{
  display:flex;gap:12px;padding:20px 32px 0;overflow-x:auto;
  scrollbar-width:none;
}
.stats-bar::-webkit-scrollbar{display:none}
.stat-pill{
  background:var(--surface-hi);backdrop-filter:var(--blur-sm);
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 20px;white-space:nowrap;flex-shrink:0;
  box-shadow:var(--shadow-xs);
}
.stat-pill strong{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--text-1)}
.stat-pill span{font-size:11px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}

/* ── SECTION ── */
.section{padding:20px 32px 48px;display:none}
.section.active{display:block}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
.section-header h2{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--text-1)}
.section-actions{display:flex;gap:8px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r-md);
  padding:8px 16px;font-size:13px;font-weight:600;font-family:inherit;
  transition:all .18s var(--ease-spring);white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep);box-shadow:0 3px 12px var(--brand-glow)}
.btn-ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-hi);color:var(--text-1)}
.btn-danger{background:rgba(232,66,10,.1);color:var(--red);border:1px solid rgba(232,66,10,.2)}
.btn-danger:hover{background:rgba(232,66,10,.18)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:var(--r-sm)}
.btn:active{transform:scale(.97)}

/* ── BIKE CARDS ── */
.bikes-grid{display:flex;flex-direction:column;gap:12px}

.bike-row{
  background:var(--surface-hi);backdrop-filter:var(--blur-sm);
  border:1px solid var(--border);border-radius:var(--r-xl);
  padding:18px 20px;
  display:grid;
  grid-template-columns:72px 1fr auto;
  gap:16px;align-items:center;
  box-shadow:var(--shadow-xs);
  transition:box-shadow .2s,transform .2s var(--ease-out);
}
.bike-row:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}

.bike-thumb{
  width:72px;height:56px;border-radius:var(--r-sm);
  object-fit:contain;background:var(--bg-alt);border:1px solid var(--border-lo);padding:4px;
}
.bike-thumb-placeholder{
  width:72px;height:56px;border-radius:var(--r-sm);
  background:var(--bg-alt);border:1px solid var(--border-lo);
  display:flex;align-items:center;justify-content:center;font-size:28px;opacity:.5;
}

.bike-info{min-width:0}
.bike-brand-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--brand);margin-bottom:2px}
.bike-name{font-size:15px;font-weight:700;color:var(--text-1);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bike-meta{font-size:12px;color:var(--text-3);margin-top:2px}
.bike-meta b{color:var(--text-2)}

.bike-controls{display:flex;flex-direction:column;gap:10px;align-items:flex-end;min-width:360px}

/* Pricing row */
.pricing-row{display:flex;align-items:center;gap:8px}
.pricing-lbl{font-size:10px;font-weight:600;color:var(--text-4);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.price-input-wrap{position:relative;display:flex;align-items:center}
.price-input-wrap .unit{
  position:absolute;left:10px;font-size:13px;font-weight:600;color:var(--text-3);pointer-events:none
}
.price-input-wrap .unit-right{left:auto;right:10px}
.price-input{
  border:1px solid var(--border-hi);border-radius:var(--r-sm);
  padding:7px 28px;font-size:14px;font-weight:700;color:var(--text-1);
  background:var(--surface);outline:none;width:110px;font-family:inherit;
  transition:border-color .18s,box-shadow .18s;
}
.price-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-glow)}
.price-input.eur{padding-left:24px;padding-right:8px}
.price-input.pct{padding-right:24px;padding-left:8px}
.arrow-icon{color:var(--text-4);font-size:14px}
.save-price-btn{
  background:var(--brand);color:#fff;border:none;border-radius:var(--r-sm);
  padding:7px 14px;font-size:12px;font-weight:600;font-family:inherit;
  transition:all .15s var(--ease-spring);white-space:nowrap;
}
.save-price-btn:hover{background:var(--brand-deep);box-shadow:0 2px 8px var(--brand-glow)}
.save-price-btn.saved{background:rgba(45,179,122,.15);color:var(--brand);border:1px solid rgba(45,179,122,.3)}

/* Shop toggles row */
.shops-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.shops-lbl{font-size:10px;font-weight:600;color:var(--text-4);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.shop-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface-lo);border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-3);
  transition:all .18s var(--ease-spring);user-select:none;
}
.shop-pill input[type=checkbox]{
  appearance:none;-webkit-appearance:none;
  width:14px;height:14px;border:1.5px solid var(--border-hi);border-radius:4px;
  background:var(--surface);transition:all .15s;flex-shrink:0;cursor:pointer;position:relative;
}
.shop-pill input[type=checkbox]:checked{
  background:var(--brand);border-color:var(--brand);
}
.shop-pill input[type=checkbox]:checked::after{
  content:'';position:absolute;left:3px;top:1px;width:6px;height:9px;
  border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);
}
.shop-pill.active{
  background:rgba(45,179,122,.1);border-color:rgba(45,179,122,.35);color:var(--brand-deep);
}
@media(prefers-color-scheme:dark){.shop-pill.active{color:var(--brand)}}
.shop-pill-all{
  background:var(--surface);border-color:var(--border-hi);color:var(--text-2);
  font-weight:700;
}
.shop-pill-all.all-active{
  background:rgba(45,179,122,.15);border-color:var(--brand);color:var(--brand);
}

/* ── SUBMISSIONS TABLE ── */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-select{
  border:1px solid var(--border-hi);border-radius:var(--r-sm);
  padding:8px 12px;font-size:13px;color:var(--text-1);background:var(--surface);
  outline:none;font-family:inherit;-webkit-appearance:none;
}
.filter-select:focus{border-color:var(--brand)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-new{background:rgba(232,66,10,.1);color:var(--red)}
.badge-done{background:rgba(45,179,122,.1);color:var(--brand)}
.badge-contact{background:rgba(245,158,11,.12);color:var(--amber)}

.sub-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.sub-table th{
  text-align:left;padding:8px 14px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--text-4);
  border-bottom:1px solid var(--border);position:sticky;top:56px;
  background:var(--bg);z-index:5;
}
.sub-table td{
  padding:12px 14px;border-bottom:1px solid var(--border-lo);
  color:var(--text-2);vertical-align:top;
}
.sub-table tr:last-child td{border-bottom:none}
.sub-table tr:hover td{background:var(--surface-lo)}
.sub-name{font-weight:700;color:var(--text-1);font-size:14px}
.sub-contact a{color:var(--brand);font-size:12px}
.status-select{
  border:1px solid var(--border);border-radius:var(--r-sm);
  padding:4px 8px;font-size:11px;font-weight:600;color:var(--text-2);
  background:var(--surface);outline:none;font-family:inherit;cursor:pointer;-webkit-appearance:none;
}
.sub-table-wrap{
  background:var(--surface-hi);border:1px solid var(--border);
  border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-sm);
}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text-1);color:var(--bg);
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity .2s,transform .2s var(--ease-spring);
  pointer-events:none;z-index:9000;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADING ── */
.spinner{
  width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--brand);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}
.page-loader{display:flex;align-items:center;justify-content:center;padding:80px;gap:12px;color:var(--text-3);font-weight:500}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.5}

@media(max-width:700px){
  header{padding:0 16px}
  .stats-bar,.section{padding-left:16px;padding-right:16px}
  .bike-row{grid-template-columns:56px 1fr;gap:12px}
  .bike-controls{grid-column:1/-1;min-width:0;align-items:flex-start}
  .pricing-row{flex-wrap:wrap}
  .shops-row{justify-content:flex-start}
  .section-header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🚲 Welease</div>
    <div class="login-sub">Beheerpaneel — Log in om verder te gaan</div>
    <input type="password" id="api-key-input" placeholder="Beheersleutel…" autocomplete="current-password"/>
    <button class="btn-login" onclick="doLogin()">Inloggen →</button>
    <div id="login-error">Verkeerde sleutel. Probeer opnieuw.</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<header>
  <div class="header-brand">🚲 Welease</div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="showTab('bikes')">🚴 Fietsen</button>
    <button class="nav-tab" onclick="showTab('subs')">📋 Aanvragen</button>
  </nav>
  <div class="header-right">
    <div class="status-dot"></div>
    <span id="header-status">Verbonden</span>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Uitloggen</button>
  </div>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat-pill"><strong id="stat-bikes">–</strong><span>Fietsen</span></div>
  <div class="stat-pill"><strong id="stat-clients">–</strong><span>Klanten</span></div>
  <div class="stat-pill"><strong id="stat-new">–</strong><span>Nieuwe aanvragen</span></div>
  <div class="stat-pill"><strong id="stat-total">–</strong><span>Totale aanvragen</span></div>
</div>

<!-- FIETSEN -->
<div class="section active" id="tab-bikes">
  <div class="section-header">
    <h2>Fietsen & kortingen</h2>
    <div class="section-actions">
      <button class="btn btn-ghost btn-sm" onclick="loadAll()">↻ Vernieuwen</button>
    </div>
  </div>
  <div class="bikes-grid" id="bikes-grid">
    <div class="page-loader"><div class="spinner"></div> Laden…</div>
  </div>
</div>

<!-- AANVRAGEN -->
<div class="section" id="tab-subs">
  <div class="section-header">
    <h2>Aanvragen</h2>
    <div class="filter-bar">
      <select class="filter-select" id="filter-client" onchange="loadSubmissions()">
        <option value="">Alle klanten</option>
      </select>
      <select class="filter-select" id="filter-status" onchange="loadSubmissions()">
        <option value="">Alle statussen</option>
        <option value="nieuw">Nieuw</option>
        <option value="in behandeling">In behandeling</option>
        <option value="behandeld">Behandeld</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="loadSubmissions()">↻</button>
    </div>
  </div>
  <div class="sub-table-wrap">
    <table class="sub-table">
      <thead>
        <tr>
          <th>Persoon</th>
          <th>Fiets</th>
          <th>Klant</th>
          <th>Winkel</th>
          <th>Betaling</th>
          <th>Datum</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="subs-tbody">
        <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-3)">Laden…</td></tr>
      </tbody>
    </table>
  </div>
</div>

</div><!-- /app -->

<div id="toast"></div>

<script>
const API = 'https://web-production-44ea4.up.railway.app';
let KEY = '';
let allBikes = [], allClients = [], matrix = [];

// ── AUTH ──────────────────────────────────────────────────────────────────
function logout() {
  KEY = ''; sessionStorage.removeItem('wl_key');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('api-key-input').value = '';
}

async function doLogin() {
  const k = document.getElementById('api-key-input').value.trim();
  if (!k) return;
  const res = await fetch(`${API}/api/admin/clients`, { headers: { 'X-Api-Key': k } });
  if (res.ok) {
    KEY = k; sessionStorage.setItem('wl_key', k);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('api-key-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── TABS ──────────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'subs') loadSubmissions();
}

// ── HELPERS ───────────────────────────────────────────────────────────────
const h = (s = '') => String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;');
function api(path, opts = {}) {
  return fetch(API + path, { ...opts, headers: { 'X-Api-Key': KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
}
function fmt(n) { return '€ ' + Number(n).toLocaleString('nl-BE', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtDate(d) {
  if (!d) return '–';
  const dt = new Date(d);
  return dt.toLocaleDateString('nl-BE', { day: '2-digit', month: 'short' }) + ' ' + dt.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
}
function toast(msg, ms = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

// ── LOAD ALL ──────────────────────────────────────────────────────────────
async function loadAll() {
  const [bikesRes, clientsRes, matrixRes, statsRes] = await Promise.all([
    api('/api/admin/bikes'),
    api('/api/admin/clients'),
    api('/api/admin/matrix'),
    api('/api/admin/submissions/stats'),
  ]);
  allBikes   = await bikesRes.json();
  allClients = await clientsRes.json();
  matrix     = await matrixRes.json();
  const stats = await statsRes.json();

  document.getElementById('stat-bikes').textContent   = allBikes.length;
  document.getElementById('stat-clients').textContent = allClients.length;
  document.getElementById('stat-new').textContent     = stats.new ?? '–';
  document.getElementById('stat-total').textContent   = stats.total ?? '–';

  // Populate client filter
  const sel = document.getElementById('filter-client');
  sel.innerHTML = '<option value="">Alle klanten</option>' +
    allClients.map(c => `<option value="${h(c.slug)}">${h(c.name)}</option>`).join('');

  renderBikes();
}

// ── BIKES ─────────────────────────────────────────────────────────────────
function clientsForBike(bikeId) {
  return matrix.filter(m => m.bike_id == bikeId).map(m => m.client_id);
}

function renderBikes() {
  const grid = document.getElementById('bikes-grid');
  if (!allBikes.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🚲</div><p>Geen fietsen gevonden</p></div>';
    return;
  }

  grid.innerHTML = allBikes.map(bike => {
    const clientIds = clientsForBike(bike.id);
    const allAssigned = allClients.length > 0 && clientIds.length === allClients.length;

    // Compute effective discounted price
    let priceDef = bike.price_disc != null ? Number(bike.price_disc) : Number(bike.price_orig) * (1 - bike.discount_percent / 100);
    let pctDef   = bike.price_disc != null
      ? Math.round((1 - bike.price_disc / bike.price_orig) * 1000) / 10
      : Number(bike.discount_percent);
    let savings  = bike.price_orig - priceDef;

    const shopPills = allClients.map(c => {
      const on = clientIds.includes(c.id);
      return `<label class="shop-pill ${on ? 'active' : ''}" data-bike="${bike.id}" data-client="${c.id}">
        <input type="checkbox" ${on ? 'checked' : ''} onchange="toggleShop(${bike.id},${c.id},this)"/>
        ${h(c.name)}
      </label>`;
    }).join('');

    return `<div class="bike-row" id="bike-row-${bike.id}">
      ${bike.img
        ? `<img class="bike-thumb" src="${h(bike.img)}" alt="${h(bike.brand)} ${h(bike.model)}" loading="lazy"/>`
        : `<div class="bike-thumb-placeholder">🚲</div>`}
      <div class="bike-info">
        <div class="bike-brand-lbl">${h(bike.brand)}</div>
        <div class="bike-name">${h(bike.model)}</div>
        <div class="bike-meta">Catalogus: <b>${fmt(bike.price_orig)}</b>&nbsp;&nbsp;Besparing: <b>${fmt(savings)}</b></div>
      </div>
      <div class="bike-controls">
        <div class="pricing-row">
          <span class="pricing-lbl">Korting</span>
          <div class="price-input-wrap">
            <span class="unit unit-right">%</span>
            <input class="price-input pct" type="number" min="0" max="100" step="0.5"
              id="pct-${bike.id}" value="${pctDef.toFixed(1)}"
              oninput="syncPriceFromPct(${bike.id},${bike.price_orig})"/>
          </div>
          <span class="arrow-icon">↔</span>
          <div class="price-input-wrap">
            <span class="unit">€</span>
            <input class="price-input eur" type="number" min="0" step="10"
              id="eur-${bike.id}" value="${priceDef.toFixed(0)}"
              oninput="syncPriceFromEur(${bike.id},${bike.price_orig})"/>
          </div>
          <button class="save-price-btn" id="save-btn-${bike.id}" onclick="savePrice(${bike.id})">Opslaan</button>
        </div>
        <div class="shops-row">
          <span class="shops-lbl">Shops</span>
          <button class="shop-pill shop-pill-all ${allAssigned ? 'all-active' : ''}"
            id="all-pill-${bike.id}" onclick="toggleAllShops(${bike.id})">
            ${allAssigned ? '✓ Alle shops' : 'Alle shops'}
          </button>
          ${shopPills}
        </div>
      </div>
    </div>`;
  }).join('');
}

function syncPriceFromPct(bikeId, priceOrig) {
  const pct = parseFloat(document.getElementById('pct-' + bikeId).value) || 0;
  const eur = Math.round(priceOrig * (1 - pct / 100));
  document.getElementById('eur-' + bikeId).value = eur;
  markDirty(bikeId);
}
function syncPriceFromEur(bikeId, priceOrig) {
  const eur = parseFloat(document.getElementById('eur-' + bikeId).value) || 0;
  const pct = Math.round((1 - eur / priceOrig) * 1000) / 10;
  document.getElementById('pct-' + bikeId).value = pct;
  markDirty(bikeId);
}
function markDirty(bikeId) {
  const btn = document.getElementById('save-btn-' + bikeId);
  btn.classList.remove('saved');
  btn.textContent = 'Opslaan';
}

async function savePrice(bikeId) {
  const btn = document.getElementById('save-btn-' + bikeId);
  const eur = parseFloat(document.getElementById('eur-' + bikeId).value);
  const pct = parseFloat(document.getElementById('pct-' + bikeId).value);
  btn.textContent = '…'; btn.disabled = true;
  const res = await api(`/api/admin/bikes/${bikeId}/pricing`, {
    method: 'PATCH',
    body: JSON.stringify({ discount_percent: pct, price_disc: eur })
  });
  btn.disabled = false;
  if (res.ok) {
    const updated = await res.json();
    // Update local cache
    const idx = allBikes.findIndex(b => b.id == bikeId);
    if (idx >= 0) allBikes[idx] = updated;
    btn.classList.add('saved'); btn.textContent = '✓ Opgeslagen';
    toast('✓ Prijs bijgewerkt');
  } else {
    btn.textContent = 'Opslaan';
    toast('⚠ Fout bij opslaan');
  }
}

async function toggleShop(bikeId, clientId, checkbox) {
  const on = checkbox.checked;
  const label = checkbox.closest('.shop-pill');
  const res = on
    ? await api(`/api/admin/clients/${clientId}/bikes`, { method: 'POST', body: JSON.stringify({ bike_id: bikeId }) })
    : await api(`/api/admin/clients/${clientId}/bikes/${bikeId}`, { method: 'DELETE' });

  if (res.ok) {
    if (on) { matrix.push({ client_id: clientId, bike_id: bikeId }); label.classList.add('active'); }
    else    { matrix = matrix.filter(m => !(m.client_id == clientId && m.bike_id == bikeId)); label.classList.remove('active'); }
    updateAllPill(bikeId);
    toast(on ? `✓ Toegevoegd aan shop` : `Verwijderd uit shop`);
  } else {
    checkbox.checked = !on; // revert
    toast('⚠ Fout — probeer opnieuw');
  }
}

function updateAllPill(bikeId) {
  const clientIds = clientsForBike(bikeId);
  const allAssigned = allClients.length > 0 && clientIds.length === allClients.length;
  const pill = document.getElementById('all-pill-' + bikeId);
  if (!pill) return;
  pill.classList.toggle('all-active', allAssigned);
  pill.textContent = allAssigned ? '✓ Alle shops' : 'Alle shops';
}

async function toggleAllShops(bikeId) {
  const clientIds = clientsForBike(bikeId);
  const allAssigned = allClients.length > 0 && clientIds.length === allClients.length;
  if (!allAssigned) {
    // Assign to all
    const res = await api(`/api/admin/bikes/${bikeId}/assign-all`, { method: 'POST' });
    if (res.ok) {
      // Reload matrix
      const mRes = await api('/api/admin/matrix');
      matrix = await mRes.json();
      renderBikes();
      toast('✓ Fiets toegevoegd aan alle shops');
    }
  } else {
    // Remove from all - do sequentially
    for (const c of allClients) {
      await api(`/api/admin/clients/${c.id}/bikes/${bikeId}`, { method: 'DELETE' });
    }
    matrix = matrix.filter(m => m.bike_id != bikeId);
    renderBikes();
    toast('Fiets verwijderd uit alle shops');
  }
}

// ── SUBMISSIONS ────────────────────────────────────────────────────────────
async function loadSubmissions() {
  const client = document.getElementById('filter-client').value;
  const status = document.getElementById('filter-status').value;
  let url = '/api/admin/submissions?';
  if (client) url += `client_slug=${client}&`;
  if (status) url += `status=${encodeURIComponent(status)}&`;

  const tbody = document.getElementById('subs-tbody');
  tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-3)">Laden…</td></tr>';
  const res = await api(url);
  const subs = await res.json();

  if (!subs.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-3)">Geen aanvragen gevonden</td></tr>';
    return;
  }

  const statusBadge = s => {
    if (s === 'nieuw') return '<span class="badge badge-new">Nieuw</span>';
    if (s === 'behandeld') return '<span class="badge badge-done">Behandeld</span>';
    return '<span class="badge badge-contact">' + h(s) + '</span>';
  };

  tbody.innerHTML = subs.map(s => `<tr>
    <td>
      <div class="sub-name">${h(s.voornaam)} ${h(s.achternaam)}</div>
      <div class="sub-contact">
        <a href="mailto:${h(s.email)}">${h(s.email)}</a><br/>
        <a href="tel:${h(s.tel)}">${h(s.tel)}</a>
      </div>
      ${s.bedrijf ? `<div style="font-size:11px;color:var(--text-4);margin-top:3px">${h(s.bedrijf)}</div>` : ''}
    </td>
    <td>
      <div style="font-weight:600;color:var(--text-1)">${h(s.bike_brand)} ${h(s.bike_model)}</div>
      ${s.maat ? `<div style="font-size:11px;color:var(--text-3)">Maat: ${h(s.maat)}</div>` : ''}
      ${s.batterij ? `<div style="font-size:11px;color:var(--text-3)">🔋 ${h(s.batterij)}</div>` : ''}
    </td>
    <td><span style="font-size:12px;font-weight:600;color:var(--brand)">${h(s.client_slug)}</span></td>
    <td>
      <div style="font-size:12px">${h(s.store_name) || '–'}</div>
      ${s.store_email ? `<a href="mailto:${h(s.store_email)}" style="font-size:11px;color:var(--text-3)">${h(s.store_email)}</a>` : ''}
    </td>
    <td style="font-size:12px">${h(s.betaling) || '–'}</td>
    <td style="font-size:12px;color:var(--text-3);white-space:nowrap">${fmtDate(s.created_at)}</td>
    <td>${statusBadge(s.status)}</td>
    <td>
      <select class="status-select" onchange="updateStatus(${s.id},this.value)">
        <option value="nieuw" ${s.status==='nieuw'?'selected':''}>Nieuw</option>
        <option value="in behandeling" ${s.status==='in behandeling'?'selected':''}>In behandeling</option>
        <option value="behandeld" ${s.status==='behandeld'?'selected':''}>Behandeld</option>
      </select>
    </td>
  </tr>`).join('');
}

async function updateStatus(id, status) {
  const res = await api(`/api/admin/submissions/${id}`, { method: 'PUT', body: JSON.stringify({ status }) });
  if (res.ok) toast('✓ Status bijgewerkt');
  else { toast('⚠ Fout'); loadSubmissions(); }
}

// ── INIT ──────────────────────────────────────────────────────────────────
const saved = sessionStorage.getItem('wl_key');
if (saved) {
  KEY = saved;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
}
</script>
